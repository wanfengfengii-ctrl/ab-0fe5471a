name: vector-clock-audit

services:
  app:
    build: .
    image: vector-clock-audit:latest
    environment:
      APP_PORT: ${APP_PORT:-8080}
    ports:
      # Host port is configured via APP_PORT (default 8080).
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
